<path d="M204 534 a308 308 0 1 0 616 0 a308 308 0 1 0 -616 0 Z M390 534 a122 122 0 1 1 244 0 a122 122 0 1 1 -244 0 Z" fill="#000" fill-opacity="0.06" fill-rule="evenodd"/>
<!-- Platter ring -->
<path d="M216 512 a296 296 0 1 0 592 0 a296 296 0 1 0 -592 0 Z M378 512 a134 134 0 1 1 268 0 a134 134 0 1 1 -268 0 Z" fill="url(#plat)" fill-rule="evenodd"/>
<!-- Tracks and lifebuoy bands, clipped to the ring -->
<g clip-path="url(#rc)">
  <circle cx="512" cy="512" r="170" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="2.5"/>
  <circle cx="512" cy="512" r="200" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="2.5"/>
  <circle cx="512" cy="512" r="230" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="2.5"/>
  <circle cx="512" cy="512" r="260" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="2.5"/>
  <path d="M780.27 637.10 A296 296 0 0 1 637.10 780.27 L568.63 633.45 A134 134 0 0 0 633.45 568.63 Z" fill="url(#band)"/>
  <path d="M386.90 780.27 A296 296 0 0 1 243.73 637.10 L390.55 568.63 A134 134 0 0 0 455.37 633.45 Z" fill="url(#band)"/>
  <path d="M243.73 386.90 A296 296 0 0 1 386.90 243.73 L455.37 390.55 A134 134 0 0 0 390.55 455.37 Z" fill="url(#band)"/>
  <path d="M637.10 243.73 A296 296 0 0 1 780.27 386.90 L633.45 455.37 A134 134 0 0 0 568.63 390.55 Z" fill="url(#band)"/>
</g>
<path d="M216 512 a296 296 0 1 0 592 0 a296 296 0 1 0 -592 0 Z M378 512 a134 134 0 1 1 268 0 a134 134 0 1 1 -268 0 Z" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
<!-- Spindle hub -->
<circle cx="512" cy="512" r="56" fill="url(#plat)"/>
<circle cx="512" cy="512" r="56" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="3"/>
<circle cx="512" cy="512" r="18" fill="#25292B"/>
</svg>
