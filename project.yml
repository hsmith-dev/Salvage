# xcodegen spec for Salvage.xcodeproj.
#
# Salvage.xcodeproj is committed alongside this file so CI and contributors without xcodegen
# installed can build directly; this file is the source of truth to regenerate it after
# structural changes (new files, new targets, new local packages) via `xcodegen generate`.
#
# Per spec-1-1's Resolved Decisions: DEVELOPMENT_TEAM is deliberately left unset here. Locally,
# pick a team in Xcode's Signing & Capabilities tab (the team picker, backed by the signed-in
# Apple ID) -- never hardcode a Team ID string in this file. In CI, DEVELOPMENT_TEAM is supplied
# as a secret/variable at build time instead (see .github/workflows/release.yml).
name: Salvage

options:
  bundleIdPrefix: dev.hsmith
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SalvageCore:
    path: SalvageCore
  SalvageDiskIO:
    path: SalvageDiskIO

targets:
  Salvage:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Salvage
      # Story 1.12 / AD-13: the privileged helper's launchd plist, copied to
      # Salvage.app/Contents/Library/LaunchDaemons/ where SMAppService.daemon(plistName:) finds it.
      - path: SalvageHelper/dev.hsmith.Salvage.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hsmith.Salvage
        PRODUCT_NAME: Salvage
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # spec-tech-batch-7 §E: the app icon lives in Salvage/Assets.xcassets (picked up by the
        # `Salvage` source path above); its PNGs are rendered from docs/brand/icon.svg by
        # scripts/render-icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    postBuildScripts:
      # Story 1.12 / AD-13: pin the helper's launchd SpawnConstraint to this build's team. The
      # source plist pins only the signing identifier, because the Team ID is never hardcoded
      # (see the header). DEVELOPMENT_TEAM comes from Xcode's team picker locally and from the
      # release workflow in CI; with no valid team (unsigned CI builds) the plist is left as is.
      # Runs after the copy phase and before the app is signed, so the seal covers the result.
      - name: Pin helper SpawnConstraint team
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/dev.hsmith.Salvage.Helper.plist"
          team="${DEVELOPMENT_TEAM:-}"
          if ! printf '%s' "$team" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "note: no valid DEVELOPMENT_TEAM; helper SpawnConstraint pins the signing identifier only"
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Delete :SpawnConstraint:team-identifier" "$plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :SpawnConstraint:team-identifier string $team" "$plist"
    dependencies:
      - package: SalvageCore
        product: SalvageCore
      - package: SalvageDiskIO
        product: SalvageDiskIO
      # The helper binary lands in Salvage.app/Contents/MacOS/SalvageHelper (the plist's
      # BundleProgram), signed on copy when signing is enabled (inside-out: helper first).
      - target: SalvageHelper
        embed: true
        codeSign: true
        copy:
          destination: executables

  # Story 1.12 / AD-13: the privileged read-only helper, a launchd daemon run as root. It
  # compiles only its own main.swift plus SalvageDiskIO's HelperShared/ sources (pure validation
  # rules, IORegistry/statfs queries): no SalvageCore, no DiskArbitration, no package products.
  SalvageHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SalvageHelper
        excludes:
          - "*.plist"
      - path: SalvageDiskIO/Sources/SalvageDiskIO/HelperShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hsmith.Salvage.Helper
        PRODUCT_NAME: SalvageHelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        # Embeds an Info.plist section so the code-signing identifier is the bundle ID above,
        # which the app's peer requirement pins.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        # Debug only: the helper also accepts an Apple Development-signed app, so a Debug build
        # signed in Xcode can be tested end to end. Release always requires Developer ID
        # (HelperShared/PrivilegedOpenProtocol.swift, `allowsDevelopmentSigning`).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SALVAGE_HELPER_ALLOW_DEVELOPMENT"

  SalvageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SalvageTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Salvage
      - package: SalvageCore
        product: SalvageCore
      - package: SalvageDiskIO
        product: SalvageDiskIO

  # spec-tech-batch-5 §C: end-to-end UI tests. They launch the Debug app with
  # `-SalvageUITestFixture <name>` (Salvage/Testing/UITestFixtures.swift, DEBUG only), which swaps
  # the device watcher, scan runner and recovery destination for in-memory fakes: no real device is
  # listed or read, and recovery writes only to a temporary folder the test creates.
  SalvageUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SalvageUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Salvage
    dependencies:
      - target: Salvage

schemes:
  Salvage:
    build:
      targets:
        Salvage: all
        SalvageHelper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalvageTests
        - SalvageUITests
        - package: SalvageCore/SalvageCoreTests
        - package: SalvageDiskIO/SalvageDiskIOTests
    archive:
      config: Release
