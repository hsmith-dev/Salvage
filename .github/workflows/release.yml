name: Release

# Architecture AD-10: build, sign, and release pipeline. Triggered by a pushed version tag;
# produces a Developer-ID-signed, notarized .app published to GitHub Releases with SHA-256
# checksums -- never a silent partial success. If any required secret is missing, this workflow
# fails loudly, naming the missing secret, before building or publishing anything.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-sign-notarize-release:
    name: Build, Sign, Notarize, and Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pinned toolchain as CI, so a release is built with the Xcode CI tested.
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # Fail fast, before any build/sign/notarize work, if a required secret is absent. Per
      # spec-1-1's Resolved Decisions, these four secret names are the wired contract:
      #   DEVELOPER_ID_APPLICATION_CERT_P12 -- base64-encoded Developer ID Application .p12
      #   DEVELOPER_ID_CERT_PASSWORD        -- password for that .p12
      #   NOTARIZATION_API_KEY              -- "<KEY_ID>:<ISSUER_ID>:<base64 .p8 private key>"
      #                                        (App Store Connect API key, all three notarytool
      #                                        credential parts packed into this one secret,
      #                                        since this story names exactly one secret for
      #                                        notarization)
      #   DEVELOPMENT_TEAM                  -- HSmithDev LLC's Apple Developer Team ID
      # Logic lives in scripts/check-release-secrets.sh (covered by
      # scripts/test-check-release-secrets.sh) rather than inline here, so it has automated
      # coverage.
      - name: Verify required secrets are present
        env:
          DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARIZATION_API_KEY: ${{ secrets.NOTARIZATION_API_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: ./scripts/check-release-secrets.sh

      - name: Import Developer ID signing certificate into a temporary keychain
        env:
          DEVELOPER_ID_APPLICATION_CERT_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/salvage-signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert_path="$RUNNER_TEMP/developer-id.p12"

          # Make sure the decoded certificate never survives a failure partway through this step.
          trap 'rm -f "$cert_path" 2>/dev/null' EXIT

          echo "$DEVELOPER_ID_APPLICATION_CERT_P12" | base64 --decode > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          existing_keychains=()
          while IFS= read -r line; do
            existing_keychains+=("$line")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build Salvage.app (Release, signed)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/DerivedData"
          # GITHUB_REF_NAME is the pushed tag, e.g. "v1.2.0" -- strip the leading "v" so the
          # built app reports the actual release version instead of a hardcoded placeholder.
          marketing_version="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project Salvage.xcodeproj \
            -scheme Salvage \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$derived_data" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$marketing_version" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH --timestamp" \
            build
          echo "APP_PATH=$derived_data/Build/Products/Release/Salvage.app" >> "$GITHUB_ENV"

      - name: Verify code signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH"

          # Story 1.12 / AD-13: the nested privileged helper is signed inside-out (Xcode signs the
          # SalvageHelper target, then re-signs it on copy into Contents/MacOS before sealing the
          # app). Its identifier and Team ID are what the app and helper pin in their XPC peer
          # requirements, so verify both, plus hardened runtime and a secure timestamp, which
          # notarization requires of every nested binary.
          helper="$APP_PATH/Contents/MacOS/SalvageHelper"
          plutil -lint "$APP_PATH/Contents/Library/LaunchDaemons/dev.hsmith.Salvage.Helper.plist"
          codesign --verify --strict --verbose=2 "$helper"
          helper_info="$(codesign --display --verbose=4 "$helper" 2>&1)"
          app_info="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
          echo "$helper_info"
          helper_id="$(printf '%s\n' "$helper_info" | sed -n 's/^Identifier=//p')"
          helper_team="$(printf '%s\n' "$helper_info" | sed -n 's/^TeamIdentifier=//p')"
          app_team="$(printf '%s\n' "$app_info" | sed -n 's/^TeamIdentifier=//p')"
          if [ "$helper_id" != "dev.hsmith.Salvage.Helper" ]; then
            echo "::error::SalvageHelper is signed as '$helper_id', expected dev.hsmith.Salvage.Helper"; exit 1
          fi
          if [ -z "$helper_team" ] || [ "$helper_team" = "not set" ] || [ "$helper_team" != "$app_team" ]; then
            echo "::error::SalvageHelper Team ID '$helper_team' does not match the app's '$app_team'"; exit 1
          fi
          printf '%s\n' "$helper_info" | grep -q 'flags=.*runtime' || { echo "::error::SalvageHelper lacks hardened runtime"; exit 1; }
          printf '%s\n' "$helper_info" | grep -q '^Timestamp=' || { echo "::error::SalvageHelper lacks a secure timestamp"; exit 1; }

      # Story 1.12 / AD-13: launchd only spawns the helper if it matches the bundled plist's
      # SpawnConstraint, which the build pins to DEVELOPMENT_TEAM. Fail closed unless the app's
      # signing Team ID (codesign -dv -> TeamIdentifier) is the requested team, the nested helper
      # is signed by that same team, and the plist's SpawnConstraint team-identifier equals it.
      # Logic in scripts/check-helper-signing-team.sh, covered by its self-test in ci.yml.
      - name: Verify helper SpawnConstraint team matches the signing team
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: ./scripts/check-helper-signing-team.sh "$APP_PATH" "$DEVELOPMENT_TEAM"

      - name: Notarize app bundle
        env:
          NOTARIZATION_API_KEY: ${{ secrets.NOTARIZATION_API_KEY }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/Salvage-notarize.zip"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          # Make sure the decoded notarization key never survives a failure partway through this
          # step (e.g. notarytool rejecting it).
          trap 'rm -f "$notary_key_path" 2>/dev/null' EXIT

          ditto -c -k --keepParent "$APP_PATH" "$zip_path"

          # Strip all embedded whitespace/newlines before splitting -- a base64-encoded .p8 key
          # pasted in as a secret is commonly line-wrapped (e.g. `openssl base64`'s default),
          # and a `read` here-string stops at the first literal newline, which would otherwise
          # silently truncate notary_key_b64 instead of failing loudly.
          notarization_api_key_compact="$(printf '%s' "$NOTARIZATION_API_KEY" | tr -d '[:space:]')"
          IFS=':' read -r notary_key_id notary_issuer_id notary_key_b64 <<< "$notarization_api_key_compact"
          if [ -z "$notary_key_id" ] || [ -z "$notary_issuer_id" ] || [ -z "$notary_key_b64" ]; then
            echo "::error::NOTARIZATION_API_KEY is set but malformed -- expected '<KEY_ID>:<ISSUER_ID>:<base64 .p8 key>'"
            exit 1
          fi

          echo "$notary_key_b64" | base64 --decode > "$notary_key_path"

          xcrun notarytool submit "$zip_path" \
            --key "$notary_key_path" \
            --key-id "$notary_key_id" \
            --issuer "$notary_issuer_id" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH" || true

      - name: Package release artifact and compute SHA-256 checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          release_zip="$RUNNER_TEMP/release/Salvage-${GITHUB_REF_NAME}.zip"
          ditto -c -k --keepParent "$APP_PATH" "$release_zip"
          (cd "$(dirname "$release_zip")" && shasum -a 256 "$(basename "$release_zip")" > "$(basename "$release_zip").sha256")
          echo "RELEASE_ZIP=$release_zip" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A re-run after a prior failure, or a re-pushed tag, means a release for this tag may
          # already exist -- fall back to uploading the assets to it (overwriting any stale ones
          # from the earlier attempt) instead of failing outright.
          if ! gh release create "${GITHUB_REF_NAME}" \
            "$RELEASE_ZIP" "$RELEASE_ZIP.sha256" \
            --title "Salvage ${GITHUB_REF_NAME}" \
            --generate-notes; then
            echo "Release ${GITHUB_REF_NAME} already exists -- uploading assets to it instead."
            gh release upload "${GITHUB_REF_NAME}" "$RELEASE_ZIP" "$RELEASE_ZIP.sha256" --clobber
          fi

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
