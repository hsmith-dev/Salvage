name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    name: Build & Enforce Module Boundaries
    runs-on: macos-latest

    env:
      # The HFS+ and APFS real-image suites build disk images with hdiutil. Here they must run:
      # if a runner can't create/attach images, the availability tests fail instead of the
      # suites silently skipping (see *RealImageAvailabilityTests in SalvageCoreTests).
      SALVAGE_REQUIRE_HDIUTIL: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the Xcode/toolchain version explicitly rather than relying on macos-latest's
      # ever-changing default Xcode, so the build toolchain can't silently drift when GitHub
      # rotates the runner image. Bump this version deliberately when the project's actual
      # minimum Xcode requirement changes. 26.6 is the newest Xcode on the hosted macOS image
      # (16.0 is no longer installed, which failed every run); local development uses 27.x.
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # Architecture AD-9: the Core/DiskIO import boundary is CI-enforced, not just reviewed.
      # Runs before any build so a policy violation that would still compile (e.g. `import
      # SwiftUI` inside SalvageCore compiles fine on macOS) is caught and named explicitly,
      # independent of build success.
      - name: Enforce Core/DiskIO module boundary (AD-9)
        run: ./scripts/check-core-boundary.sh

      - name: Test the boundary checker itself (violation detection)
        run: ./scripts/test-check-core-boundary.sh

      # Architecture AD-12 / FR-18: no network-capable API anywhere except the designated,
      # user-initiated Check for Updates file (Salvage/Updates/UpdateChecker.swift), and no
      # remote package dependencies.
      - name: Enforce zero-network policy (AD-12)
        run: ./scripts/check-no-network.sh

      - name: Test the zero-network checker itself (violation detection)
        run: ./scripts/test-check-no-network.sh

      - name: Test the release-secrets checker itself
        run: ./scripts/test-check-release-secrets.sh

      - name: Test the release helper signing-team checker itself
        run: ./scripts/test-check-helper-signing-team.sh

      # The committed Salvage.xcodeproj must be exactly what xcodegen generates from project.yml.
      # xcodegen is pinned to an exact release, verified by SHA-256 before it runs; the version
      # must equal PINNED_XCODEGEN_VERSION in scripts/check-xcodeproj-sync.sh (which refuses any
      # other). Bump both, plus the checksum, together.
      - name: Install xcodegen (pinned, checksum-verified)
        env:
          XCODEGEN_VERSION: '2.46.0'
          XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check --strict
          rm -rf "$RUNNER_TEMP/xcodegen"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify Salvage.xcodeproj is in sync with project.yml
        run: ./scripts/check-xcodeproj-sync.sh

      - name: Test the xcodeproj sync checker itself (planted drift)
        run: ./scripts/test-check-xcodeproj-sync.sh

      - name: Build SalvageCore (swift build)
        run: swift build --package-path SalvageCore

      - name: Build SalvageDiskIO (swift build)
        run: swift build --package-path SalvageDiskIO

      - name: Run SalvageCore tests
        run: swift test --package-path SalvageCore

      - name: Run SalvageDiskIO tests
        run: swift test --package-path SalvageDiskIO

      # spec-tech-batch-6 §A: parser fuzz smoke test -- 500 mutated images per format, fixed seed, a
      # full ScanSession each, in child processes so a trap or hang fails this step with its seed.
      - name: Parser fuzz smoke test (500 iterations per format, fixed seed)
        run: ./scripts/fuzz-parsers.sh --smoke

      # Disposable spike tooling (Story 1.2's FDA/raw-device-access harness, see
      # scripts/spike-raw-device-access/), but it's still real code with safety-critical
      # boot-disk-detection logic -- build and test it like every other package in the repo
      # rather than letting it go unchecked by CI.
      - name: Build spike-raw-device-access harness (swift build)
        run: swift build --package-path scripts/spike-raw-device-access

      - name: Run spike-raw-device-access harness tests
        run: swift test --package-path scripts/spike-raw-device-access

      # Unsigned debug build: CI has no Developer ID identity/team configured (see release.yml
      # for the signed/notarized release pipeline), so signing is explicitly disabled here. This
      # also builds the privileged read-only helper (SalvageHelper, AD-13) unsigned, as an
      # embedded dependency of the app.
      - name: Build Salvage app and privileged helper (xcodebuild)
        run: |
          xcodebuild \
            -project Salvage.xcodeproj \
            -scheme Salvage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Story 1.12: SMAppService.daemon(plistName:) only finds the helper at these exact paths.
      - name: Verify the helper is embedded where launchd expects it
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Salvage.app"
          test -x "$app/Contents/MacOS/SalvageHelper"
          plist="$app/Contents/Library/LaunchDaemons/dev.hsmith.Salvage.Helper.plist"
          plutil -lint "$plist"
          test "$(plutil -extract BundleProgram raw "$plist")" = "Contents/MacOS/SalvageHelper"

      - name: Run app view-model tests
        run: |
          xcodebuild \
            -project Salvage.xcodeproj \
            -scheme Salvage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:SalvageTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      # spec-tech-batch-5 §C: end-to-end UI tests against the DEBUG-only in-memory fixture
      # (Salvage/Testing/UITestFixtures.swift): no real device is listed or read, and recovery
      # writes only to a temporary folder. XCUITest needs a logged-in GUI session and the
      # runner's Accessibility/automation permission, which hosted runners don't reliably grant,
      # so this step runs only when the repository variable SALVAGE_RUN_UI_TESTS is '1' (e.g. on a
      # self-hosted runner with a GUI session). The runner is ad-hoc signed ("Sign to Run
      # Locally"); no team or certificate is involved.
      - name: Run UI tests (opt-in, needs a GUI session)
        if: ${{ vars.SALVAGE_RUN_UI_TESTS == '1' }}
        run: |
          xcodebuild \
            -project Salvage.xcodeproj \
            -scheme Salvage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:SalvageUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test

      # Always build the UI-test bundle, so it can't rot where the step above is skipped.
      - name: Build UI tests
        run: |
          xcodebuild \
            -project Salvage.xcodeproj \
            -scheme Salvage \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
